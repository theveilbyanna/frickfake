name: ff-check
on:
  push:
    branches: [ff-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check frickfake.online
        run: |
          ns=$(dig +short NS frickfake.online @1.1.1.1 | tr '\n' ' ')
          tld=$(dig +short NS online. | head -1)
          reg=$(dig +norec +short NS frickfake.online @$tld 2>/dev/null | tr '\n' ' ')
          a=$(dig +short A frickfake.online @1.1.1.1 | tr '\n' ' ')
          www=$(dig +short www.frickfake.online @1.1.1.1 | tr '\n' ' ')
          home=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://frickfake.online/ || true)
          echo "::notice title=frickfake.online::registry_ns=[$reg] public_ns=[$ns] A=[$a] www=[$www] https=$home"
