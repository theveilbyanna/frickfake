<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrickFake</title>
<meta name="description" content="FrickFake: the old-school messenger for real people only. Your own number, a buddy list, away messages, and nobody can message you until you say yes.">
<meta name="theme-color" content="#0d0c0b">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0c0b; --ink2:#1a1817; --line:#34302c;
  --bone:#f3ece0; --muted:#b2a796; --red:#e5322b; --red-dark:#8f1712; --red-ink:#fff4ef;
  --putty:#cdc6ba; --hi:#fffaf0; --lo:#6d665c; --shadow:#2b2724; --paper:#fffdf8; --text2:#4f4942;
  --on:#3fbf4a; --away:#f2b630; --dnd:#e5322b; --off:#8e877c; --invisible:#8e877c;
  --display:'Anton', Impact, 'Arial Narrow Bold', sans-serif;
  --body:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --pixel:'Pixelify Sans', 'Courier New', monospace;
  --type:'Special Elite', 'Courier New', monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px calc(10px) ;padding-top:calc(10px + env(safe-area-inset-top));background:var(--ink);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);text-transform:uppercase;font-size:28px;line-height:1;letter-spacing:.01em;display:flex;gap:6px;text-decoration:none}
.brand .fake{position:relative}
.brand .fake::after{content:"";position:absolute;left:-6%;right:-6%;top:46%;height:.17em;background:var(--red);transform:rotate(-8deg);border-radius:3px}
.mechip{display:flex;align-items:center;gap:7px;font-family:var(--pixel);font-weight:700;font-size:15px;color:var(--bone);background:none;border:1px solid var(--line);padding:5px 9px;cursor:pointer}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,.2);background:var(--off)}
.dot.free{background:var(--on)}.dot.away{background:var(--away)}.dot.dnd{background:var(--dnd)}.dot.offline,.dot.invisible{background:var(--off)}
main{flex:1;padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
main.notabs{padding-bottom:40px}

/* retro windows */
.win{background:var(--putty);color:var(--ink);border:2px solid;border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);box-shadow:inset -2px -2px 0 var(--lo),inset 2px 2px 0 #e9e3d8,6px 6px 0 var(--red);padding:3px;margin:6px 0 22px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(90deg,var(--red-dark),var(--red));color:var(--red-ink);padding:4px 4px 4px 8px;font-family:var(--pixel);font-weight:700;font-size:15px;letter-spacing:.02em;min-height:28px}
.bar .ttl{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ctl{display:flex;gap:3px;flex:none}
.bar .ctl span{width:20px;height:18px;background:var(--putty);color:var(--ink);font:700 12px/16px var(--pixel);text-align:center;border:1px solid;border-color:var(--hi) var(--shadow) var(--shadow) var(--hi)}
.pane{padding:14px 12px 12px}
.pane.paper{background:var(--paper);margin:2px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.pane h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:30px;line-height:1;letter-spacing:.01em;margin:0}
.sub{margin:6px 0 14px;font-size:15px;color:#3f3a34}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:14px}
.opt{font-weight:500;color:#5e574e}
input:not([type=checkbox]),textarea,select{width:100%;min-height:46px;padding:10px 11px;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);box-shadow:inset 1px 1px 0 var(--shadow);border-radius:0}
textarea{min-height:84px;resize:vertical;line-height:1.4}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:4px 0 14px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--red);flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:8px 14px;background:var(--red);color:var(--red-ink);font-family:var(--pixel);font-weight:700;font-size:19px;letter-spacing:.02em;cursor:pointer;border:2px solid;border-color:#ff8a80 var(--red-dark) var(--red-dark) #ff8a80;box-shadow:1px 1px 0 var(--shadow);border-radius:0;text-decoration:none;text-align:center}
.btn:active{border-color:var(--red-dark) #ff8a80 #ff8a80 var(--red-dark)}
.btn:disabled{opacity:.6;cursor:default}
.btn.grey{background:var(--putty);color:var(--ink);border-color:var(--hi) var(--shadow) var(--shadow) var(--hi)}
.btn.green{background:var(--on);color:#06210a;border-color:#9be8a1 #1f6b26 #1f6b26 #9be8a1}
.btn.small{width:auto;min-height:40px;font-size:16px;padding:6px 12px}
.btn.ghost{background:transparent;color:var(--bone);border-color:var(--line)}
.row{display:flex;gap:8px;align-items:stretch}
.row > input,.row > select{flex:1;min-width:0}
.row > .btn{width:auto;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:#a5140d;font-weight:700;font-size:14px;margin:0 0 10px}
.err:empty{display:none}
.note{font-size:13px;color:var(--text2);margin:10px 0 0}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:-4px 0 14px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
.switch button{min-height:42px;border:0;background:#c3bcaf;font-family:var(--pixel);font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
.switch button[aria-pressed=true]{background:var(--paper);color:var(--red)}

.hero{padding:10px 2px 4px}
.logo{font-family:var(--display);text-transform:uppercase;line-height:.86;font-size:clamp(70px,22vw,120px);margin:0}
.logo span{display:block}
.logo .fake{position:relative;width:max-content}
.logo .fake::after{content:"";position:absolute;left:-4%;right:-4%;top:47%;height:.17em;background:var(--red);transform:rotate(-7deg);border-radius:4px}
.tagline{font-weight:700;font-size:20px;line-height:1.25;margin:14px 0 4px}
.muted{color:var(--muted)}
.poster img{display:block;width:100%;height:auto}
.poster .pane{padding:2px}

.numbox{margin:12px 0 8px;text-align:center;background:var(--paper);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:12px 10px}
.numbox small{display:block;font-family:var(--pixel);font-size:14px;color:var(--text2)}
.numbox b{display:block;font-family:var(--pixel);font-weight:700;font-size:clamp(42px,14vw,64px);line-height:1.05;letter-spacing:.04em;color:var(--ink)}

/* buddy list */
.buddy .list{background:var(--paper);margin:10px -12px -12px;border-top:2px solid var(--lo);padding:4px 4px 10px}
.grp{font-family:var(--pixel);font-weight:700;font-size:14px;color:#3f3a34;padding:8px 6px 4px;display:flex;gap:6px;align-items:center}
.grp::before{content:"▾";font-size:12px}
.pal{display:flex;align-items:center;gap:10px;width:100%;padding:9px 8px;font-size:16px;background:none;border:0;text-align:left;cursor:pointer;color:var(--ink);min-height:48px}
.pal:hover,.pal:focus-visible{background:#f1ebe0}
.pal .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal .st{color:#5e574e;font-size:13px;margin-left:auto;text-align:right;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font:700 13px/1 var(--body);flex:none}
.ask{margin:4px 6px 8px;padding:10px;background:#fbefe9;border:1px dashed var(--red);font-size:15px;color:var(--ink)}
.ask .who{font-weight:700;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-size:16px}
.ask .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.ask .btn{min-height:42px;font-size:16px}
.empty{padding:10px 8px;color:#5e574e;font-size:15px}

/* cards (feed, find) */
.card{background:var(--paper);color:var(--ink);border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:12px;margin:0 0 10px}
.card .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .nm{font-weight:700;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-size:16px;text-decoration:underline;text-decoration-color:transparent}
.card .nm:hover{text-decoration-color:currentColor}
.num{font-family:var(--pixel);font-size:14px;color:#5e574e}
.when{font-size:13px;color:#5e574e;margin-left:auto}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;font-size:16px}
.card .ft{display:flex;gap:8px;margin-top:10px;align-items:center}
.real{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px;background:var(--putty);border:2px solid;border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);font-family:var(--pixel);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.real[aria-pressed=true]{background:var(--red);color:#fff;border-color:#ff8a80 var(--red-dark) var(--red-dark) #ff8a80}
.linkbtn{background:none;border:0;color:#5e574e;font-size:14px;cursor:pointer;text-decoration:underline;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-family:var(--type);font-size:13px;padding:3px 8px;border:1px solid #c9c1b4;background:#f6f1e8;color:var(--ink)}
.section-title{font-family:var(--display);text-transform:uppercase;font-size:26px;margin:4px 2px 10px;letter-spacing:.01em}
.counter{font-size:13px;color:var(--text2);text-align:right;margin:-6px 0 8px}
details.more{background:var(--putty);color:var(--ink);border:2px solid;border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);margin:0 0 12px}
details.more summary{cursor:pointer;padding:12px;font-family:var(--pixel);font-weight:700;font-size:16px}
details.more > div{padding:0 12px 12px}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--putty);border-top:2px solid var(--hi);box-shadow:0 -2px 0 var(--shadow);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{position:relative;min-height:60px;border:0;background:none;color:var(--ink);font-family:var(--pixel);font-weight:700;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--red);background:var(--paper);box-shadow:inset 2px 2px 0 var(--lo)}
.tabs .badge{position:absolute;top:6px;left:calc(50% + 6px)}

/* chat + sheets */
.overlay{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;background:rgba(13,12,11,.6)}
.chat{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;background:var(--putty);color:var(--ink)}
.chat .top{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--red-dark),var(--red));color:var(--red-ink);padding:8px 8px;padding-top:calc(8px + env(safe-area-inset-top))}
.iconbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;background:var(--putty);color:var(--ink);border:2px solid;border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);font:700 20px/1 var(--pixel);cursor:pointer;flex:none}
.chat .who{flex:1;min-width:0;background:none;border:0;color:inherit;text-align:left;cursor:pointer;padding:0}
.chat .who b{display:block;font-family:var(--pixel);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .who span{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.95}
.awayline{background:#fff4d6;border-bottom:1px solid #e5cf8f;padding:7px 12px;font-size:14px;font-family:var(--type)}
.msgs{flex:1;overflow-y:auto;background:var(--paper);margin:3px;border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);padding:10px 10px 14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.day{text-align:center;font-family:var(--pixel);font-size:13px;color:#7a7266;margin:12px 0 6px}
.msg{display:flex;flex-direction:column;margin:3px 0;max-width:82%}
.msg.me{margin-left:auto;align-items:flex-end}
.msg .bub{padding:8px 11px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.35;border:2px solid}
.msg.them .bub{background:#ece6dc;border-color:#d8d0c3}
.msg.me .bub{background:var(--red);color:#fff;border-color:var(--red-dark)}
.msg .meta{font-size:11px;color:#7a7266;margin:2px 3px 0}
.seen{font-size:12px;color:#7a7266;text-align:right;margin:2px 4px 0;font-family:var(--pixel)}
.compose{display:flex;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));align-items:flex-end}
.compose textarea{min-height:46px;max-height:140px;resize:none;flex:1}
.compose .btn{width:auto;min-width:76px}
.sheet{align-items:flex-end}
.sheet .box{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--putty);color:var(--ink);border:2px solid;border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);padding:3px 3px calc(10px + env(safe-area-inset-bottom))}
.sheet .pane{padding:14px 12px 6px}
.stack{display:flex;flex-direction:column;gap:8px}
.kv{font-size:15px;margin:4px 0}
.temp{font-family:var(--pixel);font-size:26px;text-align:center;background:var(--paper);padding:10px;border:2px dashed var(--red);margin:10px 0;user-select:all}

.stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.stat{background:var(--ink2);border:1px solid var(--line);padding:8px 10px;min-width:96px}
.stat b{display:block;font-family:var(--pixel);font-size:26px;color:var(--bone)}
.stat span{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-family:var(--pixel);font-size:12px;padding:1px 6px;border:1px solid currentColor;margin-left:6px}
.tag.ok{color:#1f7a29}.tag.wait{color:#9a6a00}.tag.bad{color:#a5140d}
.home{display:block;text-align:center;font-family:var(--type);color:var(--muted);font-size:14px;margin:6px 0 20px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--putty);color:var(--ink);font-family:var(--pixel);font-weight:700;padding:10px 16px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;border:2px solid;border-color:var(--hi) var(--shadow) var(--shadow) var(--hi);box-shadow:4px 4px 0 var(--red);max-width:92vw;text-align:center}
.toast.show{opacity:1}
.spin{padding:40px 0;text-align:center;font-family:var(--pixel);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="appbar">
    <a class="brand" href="/" aria-label="FrickFake home"><span>Frick</span><span class="fake">Fake</span></a>
    <button class="mechip" id="mechip" type="button" hidden><i class="dot" id="medot"></i><span id="menum"></span></button>
  </header>
  <main id="view"><p class="spin">Loading…</p></main>
</div>
<nav class="tabs" id="tabs" hidden aria-label="FrickFake">
  <button type="button" data-tab="buddies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.8-.3 4.9 1.4 5.5 4.4"/></svg><span>Buddies</span><span class="badge" id="badge-buddies" hidden></span></button>
  <button type="button" data-tab="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17"/><path d="M7.5 9h9M7.5 13h9M7.5 17h5"/></svg><span>Feed</span></button>
  <button type="button" data-tab="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></svg><span>Find</span></button>
  <button type="button" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>Me</span></button>
</nav>
<div class="overlay" id="chat" hidden></div>
<div class="overlay sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var S = { me: undefined, tab: 'buddies', buddies: [], incoming: [], outgoing: [], chat: null, lastMsgId: 0, firstMsgId: 0, seenUpTo: 0, feedBefore: 0, unreadTotal: -1 };
var STATUS = [['free','Free to chat'],['away','Away'],['dnd','Do not disturb'],['invisible','Invisible']];
var LABEL = { free:'Free to chat', away:'Away', dnd:'Do not disturb', invisible:'Invisible', offline:'Offline' };
var timer = null, fid = 0, AC = null;

// ---------- helpers ----------
function h(tag, a){
  var el = document.createElement(tag);
  if (a) for (var k in a) {
    var v = a[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'value') el.value = v;
    else if (k.slice(0,2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c){
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function(x){ add(el, x); }); return; }
  el.append(c instanceof Node ? c : document.createTextNode(String(c)));
}
function num(n){ return '#' + String(n || 0).padStart(6, '0'); }
function view(node, opts){ var v = $('view'); v.className = opts && opts.notabs ? 'notabs' : ''; v.replaceChildren(node); }
function win(title, body, o){
  o = o || {};
  return h('div', { class: 'win ' + (o.cls || '') },
    h('div', { class: 'bar' }, h('span', { class: 'ttl' }, o.dot ? h('i', { class: 'dot ' + o.dot, 'aria-hidden': 'true' }) : null, title),
      h('span', { class: 'ctl', 'aria-hidden': 'true' }, h('span', null, '_'), h('span', null, '×'))),
    h('div', { class: 'pane' + (o.paper ? ' paper' : '') }, body));
}
function field(label, input, optional, hint){
  var id = 'f' + (++fid); input.id = id;
  return h('div', { class: 'field' }, h('label', { for: id }, label, optional ? h('span', { class: 'opt' }, ' (optional)') : null), input, hint ? h('span', { class: 'opt', style: 'font-size:13px' }, hint) : null);
}
function checkbox(input, text){ var id = 'f' + (++fid); input.id = id; return h('label', { class: 'check', for: id }, input, h('span', null, text)); }
var tt;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove('show'); }, 2400); }
function ago(t){
  if (!t) return '';
  var s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';

// ---------- overlays (chat, sheets) close with the phone's back button ----------
// One extra history entry ("guard") stays while anything is open, so Android's back button closes the top layer.
var stack = [], guard = false, ignorePop = false;

  stack.push(close);
  if (!guard) { guard = true; try { history.pushState({ ff: 1 }, ''); } catch (e) {} }
}
function dropGuard(){ if (guard) { guard = false; ignorePop = true; try { history.back(); } catch (e) { ignorePop = false; } } }

});

function olderBtn(id){

function appendMsgs(list, forceScroll){

      h('div', { class: 'hd' }, h('b', null, u.screen_name), h('span', { class: 'num' }, num(u.number)), h('span', { class: 'when' }, ago(u.created_at))),
      h('p', { class: 'kv' }, u.email + (u.city ? ' · ' + u.city : '')),
      u.from_waitlist ? h('p', { class: 'kv' }, 'On the waitlist as “' + (u.waitlist_name || '?') + '”') : h('p', { class: 'kv' }, 'Signed up in the app (not on the waitlist)'),
      u.why ? h('p', { class: 'kv' }, 'Why they quit fake social: “' + u.why + '”') : null,
      u.interests ? h('p', { class: 'kv' }, 'Interests: ' + u.interests) : null,
      u.bio ? h('p', { class: 'body' }, u.bio) : null,
      h('div', { class: 'grid2', style: 'margin-top:10px' },
        h('button', { class: 'btn green', type: 'button', onclick: function(){ act({ action: 'admin_set', id: u.id, verified: true }, 'Verified ' + u.screen_name + '.'); } }, 'Verify'),
        h('button', { class: 'btn grey', type: 'button', onclick: async function(){ if (await confirmSheet('Ban ' + u.screen_name + '?', 'They’ll be kicked out and can’t log in.', 'Ban', true)) act({ action: 'admin_set', id: u.id, banned: true }, 'Banned.'); } }, 'Ban')));
  }) : [h('div', { class: 'card' }, 'Nobody waiting. 🎉')];
  var reports = r.reports.map(function(x){
    return h('div', { class: 'card' },
      h('div', { class: 'hd' }, h('b', null, x.target_name), h('span', { class: 'num' }, num(x.target_number)), x.target_banned ? h('span', { class: 'tag bad' }, 'banned') : null, h('span', { class: 'when' }, ago(x.created_at))),
      h('p', { class: 'kv' }, 'Reported by ' + (x.reporter_name ? x.reporter_name + ' ' + num(x.reporter_number) : 'a deleted account')),
      x.reason ? h('p', { class: 'body' }, x.reason) : null,
      h('div', { class: 'grid2', style: 'margin-top:10px' },
        x.target_banned ? h('span') : h('button', { class: 'btn', type: 'button', onclick: async function(){ if (await confirmSheet('Ban ' + x.target_name + '?', 'They’ll be kicked out and can’t log in.', 'Ban', true)) { await act({ action: 'admin_set', id: x.target_id, banned: true }, 'Banned.'); act({ action: 'admin_resolve', id: x.id }, 'Report closed.'); } } }, 'Ban them'),
        h('button', { class: 'btn grey', type: 'button', onclick: function(){ act({ action: 'admin_resolve', id: x.id }, 'Report closed.'); } }, 'Dismiss')));
  });
  var members = r.members.map(function(u){
    var tag = u.banned ? h('span', { class: 'tag bad' }, 'banned') : u.verified ? h('span', { class: 'tag ok' }, 'verified') : h('span', { class: 'tag wait' }, 'waiting');
    return h('div', { class: 'card' },
      h('div', { class: 'hd' }, h('b', null, u.screen_name), h('span', { class: 'num' }, num(u.number)), tag, h('span', { class: 'when' }, u.last_seen ? 'on ' + ago(u.last_seen) : 'never on')),
      h('p', { class: 'kv' }, u.email + (u.city ? ' · ' + u.city : '')),
      h('div', { class: 'row', style: 'flex-wrap:wrap;margin-top:8px' },
        u.banned ? h('button', { class: 'btn small grey', type: 'button', onclick: function(){ act({ action: 'admin_set', id: u.id, banned: false }, 'Unbanned.'); } }, 'Unban')
          : h('button', { class: 'btn small grey', type: 'button', onclick: async function(){ if (await confirmSheet('Ban ' + u.screen_name + '?', 'They’ll be kicked out and can’t log in.', 'Ban', true)) act({ action: 'admin_set', id: u.id, banned: true }, 'Banned.'); } }, 'Ban'),
        h('button', { class: 'btn small grey', type: 'button', onclick: function(){ act({ action: 'admin_set', id: u.id, verified: !u.verified }, u.verified ? 'Unverified.' : 'Verified.'); } }, u.verified ? 'Unverify' : 'Verify'),
        h('button', { class: 'btn small grey', type: 'button', onclick: async function(){
          if (!(await confirmSheet('Reset ' + u.screen_name + '’s password?', 'They’ll be logged out. You’ll get a temporary password to send them.', 'Reset it'))) return;
          try {
            var x = await api('admin_reset_password', { key: key, id: u.id });
            var copy = h('button', { class: 'btn', type: 'button', onclick: function(){ if (navigator.clipboard) navigator.clipboard.writeText(x.temp_password).then(function(){ toast('Copied'); }); } }, 'Copy');
            setTimeout(function(){ sheet('Temporary password', h('div', null, h('p', { class: 'sub', style: 'margin-top:0' }, 'Send this to ' + u.screen_name + '. They can change it in Me after logging in.'), h('div', { class: 'temp' }, x.temp_password), copy)); }, 80);
          } catch (e) { toast(e.message); }
        } }, 'Reset password')));
  });
  view(h('div', null,
    h('h2', { class: 'section-title' }, 'Boss mode'),
    h('div', { class: 'stats' }, stat(c.total, 'members'), stat(c.verified, 'verified'), stat(c.pending, 'waiting'), stat(c.online, 'online now'), stat(c.messages, 'messages'), stat(c.posts, 'posts'), stat(c.banned, 'banned')),
    h('h2', { class: 'section-title' }, 'Waiting room (' + r.pending.length + ')'), pending,
    reports.length ? [h('h2', { class: 'section-title' }, 'Reports (' + reports.length + ')'), reports] : null,
    h('details', { class: 'more' }, h('summary', null, 'All members (' + r.members.length + ')'), h('div', null, members)),
    h('div', { class: 'grid2' },
      h('a', { class: 'btn grey', href: '/api/admin?key=' + encodeURIComponent(key), target: '_blank', rel: 'noopener' }, 'Waitlist list'),
      h('button', { class: 'btn grey', type: 'button', onclick: function(){ loadBoss(key); } }, 'Refresh')),
    h('div', { class: 'grid2', style: 'margin-top:8px' },
      h('a', { class: 'btn ghost', href: '/app' }, 'Open the app'),
      h('button', { class: 'btn ghost', type: 'button', onclick: function(){ store('ff_boss', null); viewBoss(); } }, 'Forget key'))
  ), { notabs: true });
}

// ---------- start ----------
function viewNoDb(){
  view(h('div', null, win('Almost ready', [
    h('h2', null, 'FrickFake is almost open'),
    h('p', { class: 'sub' }, 'The app is here, but its database isn’t connected yet. Check back soon!'),
    h('p', { class: 'note' }, 'Running this site? In Vercel, open the frickfake project → Storage → connect a Neon database, then redeploy.')
  ]), h('a', { class: 'home', href: '/' }, '← Back to FrickFake')), { notabs: true });
}
function start(){
  if (location.hash === '#boss') return viewBoss();
  if (!S.me) return viewAuth(new URLSearchParams(location.search).get('email') || !store('ff_known') ? 'new' : 'login');
  if (!S.me.verified) return viewPending();
  S.unreadTotal = -1;
  viewMain(); poll();
}
async function boot(){
  if (location.hash === '#boss') return viewBoss();
  try { var r = await api('me'); S.me = r.me; }
  catch (e) { if (e.code === 'no_db' || e.code === 'db_down') return viewNoDb(); S.me = null; }
  start();
}
window.addEventListener('hashchange', function(){ if (location.hash === '#boss') viewBoss(); else boot(); });
boot();
})();
</script>
